name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MiTrading.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: MiTrading-apk
          path: MiTrading.apk

      - name: Publicar APK para descarga directa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MiTrading.apk \
            --title "Mi trading (última versión)" \
            --notes "Descarga MiTrading.apk en la tablet y ábrelo para instalarlo." \
            --target "${GITHUB_SHA}"
